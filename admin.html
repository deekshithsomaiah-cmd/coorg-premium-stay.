<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COORG | Reservations Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b110d;
      --card-bg: #16201a;
      --accent: #d4a373;
      --text: #f4f1de;
      --text-muted: #a3b18a;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text);
      padding: 3rem 2rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    h1 { font-size: 1.8rem; font-weight: 500; letter-spacing: 1px; }

    .btn {
      background: var(--accent);
      color: #0b110d;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .metric-card h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .metric-card p { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin-top: 0.5rem; }

    /* Table */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      padding: 1.2rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td { border-bottom: none; }

    .status-badge {
      background: rgba(212, 163, 115, 0.15);
      color: var(--accent);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>COORG Reservations Admin</h1>
      <a href="http://localhost:3000/api/calendar.ics" target="_blank" class="btn">Export iCal Feed</a>
    </header>

    <!-- Overview Stats -->
    <div class="metrics-grid">
      <div class="metric-card">
        <h3>Total Reservations</h3>
        <p id="total-bookings">0</p>
      </div>
      <div class="metric-card">
        <h3>Gross Revenue</h3>
        <p id="total-revenue">₹0</p>
      </div>
      <div class="metric-card">
        <h3>Nights Booked</h3>
        <p id="total-nights">0</p>
      </div>
    </div>

    <!-- Booking Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Guest Name</th>
            <th>Email</th>
            <th>Property</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Guests</th>
            <th>Amount Paid</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="bookings-table-body">
          <tr>
            <td colspan="8" style="text-align:center; color: var(--text-muted);">Loading reservations...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadDashboardData() {
      try {
        const response = await fetch('http://localhost:3000/api/admin/bookings');
        const bookings = await response.json();

        const tableBody = document.getElementById('bookings-table-body');
        tableBody.innerHTML = '';

        if (!bookings || bookings.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color: var(--text-muted);">No bookings found yet.</td></tr>`;
          return;
        }

        let revenue = 0;
        let nightsTotal = 0;

        bookings.forEach(b => {
          const paidAmount = Number(b.amountPaid) || 0;
          revenue += paidAmount;
          
          const start = new Date(b.checkIn);
          const end = new Date(b.checkOut);
          const nights = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
          if (!isNaN(nights) && nights > 0) nightsTotal += nights;

          const row = `
            <tr>
              <td><strong>${b.customerName || 'Guest'}</strong></td>
              <td>${b.customerEmail || 'N/A'}</td>
              <td>${b.propertyId || 'canopy-loft'}</td>
              <td>${b.checkIn}</td>
              <td>${b.checkOut}</td>
              <td>${b.guests}</td>
              <td>₹${paidAmount.toLocaleString('en-IN')}</td>
              <td><span class="status-badge">Confirmed</span></td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });

        document.getElementById('total-bookings').innerText = bookings.length;
        document.getElementById('total-revenue').innerText = `₹${revenue.toLocaleString('en-IN')}`;
        document.getElementById('total-nights').innerText = nightsTotal;

      } catch (err) {
        console.error('Failed to load dashboard:', err);
        document.getElementById('bookings-table-body').innerHTML = 
          `<tr><td colspan="8" style="text-align:center; color: #ff6b6b;">Failed to load reservations from backend server.</td></tr>`;
      }
    }

    loadDashboardData();
  </script>

</body>
</html>
